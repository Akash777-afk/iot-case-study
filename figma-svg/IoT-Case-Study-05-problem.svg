<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1100" viewBox="0 0 1440 1100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="c139"><rect x="100.0" y="378.1" width="612.0" height="410.5" rx="24.0" /></clipPath><clipPath id="c147"><rect x="728.0" y="378.1" width="612.0" height="410.5" rx="24.0" /></clipPath></defs><rect width="100%" height="100%" fill="#050c1c"/><g id="section.band-126"><g id="div.rail-127"><g id="div.sec-head-128"><g><g id="span.label-129"><g id="span.dot-130"><rect x="100.0" y="132.0" width="8.0" height="8.0" rx="4.0" fill="#6cb6ff"/></g><text x="118.0" y="139.4" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="1.92" fill="#93a7c6">03 — PROBLEM &amp; SOLUTION</text></g><g><text x="100.0" y="230.2" font-family="Unbounded" font-size="72" font-weight="800" letter-spacing="-1.44" fill="#eaf1fc">A million rows.</text><g><text x="100.0" y="303.6" font-family="Unbounded" font-size="72" font-weight="800" letter-spacing="-1.44" fill="#6cb6ff">One answer.</text></g></g></g><g><text x="794.5" y="252.5" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">Operators had all the data and none of the answers. The fix</text><text x="794.5" y="279.7" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">was less about adding features and more about the order in</text><text x="794.5" y="306.9" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">which questions get answered.</text></g></g><g id="div.ps-131"><g id="article.ps-card-132"><rect x="100.0" y="378.1" width="612.0" height="410.5" rx="24.0" fill="#0b1a36"/><rect x="100.5" y="378.6" width="611.0" height="409.5" rx="23.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g clip-path="url(#c139)"><g id="span.label-133"><g id="span.dot-134"><rect x="141.0" y="431.1" width="8.0" height="8.0" rx="4.0" fill="#f06a6a"/></g><text x="159.0" y="438.5" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="1.92" fill="#93a7c6">PROBLEM STATEMENT</text></g><g><text x="141.0" y="494.3" font-family="Unbounded" font-size="34" font-weight="800" letter-spacing="-0.68" fill="#eaf1fc">Every incident started</text><text x="141.0" y="528.9" font-family="Unbounded" font-size="34" font-weight="800" letter-spacing="-0.68" fill="#eaf1fc">with a spreadsheet.</text></g><g><text x="141.0" y="569.6" font-family="Manrope" font-size="17" font-weight="400" fill="#c4d3ea">NOC operators tracked 1,000,000 IoT devices in one 22-column</text><text x="141.0" y="596.8" font-family="Manrope" font-size="17" font-weight="400" fill="#c4d3ea">Excel file. Finding which tower was failing which customer took</text><text x="141.0" y="624.0" font-family="Manrope" font-size="17" font-weight="400" fill="#c4d3ea">hours.</text></g><g id="ul.ps-list-135"><g id="li.pseudo-off-136"><g opacity="0.700"><rect x="141.0" y="662.2" width="8.0" height="8.0" rx="2.0" fill="#b5c5de"/></g><text x="161.0" y="671.2" font-family="Manrope" font-size="15.5" font-weight="400" fill="#b5c5de">One bad BTS showed up as hundreds of separate red rows.</text></g><g id="li.pseudo-off-137"><g opacity="0.700"><rect x="141.0" y="697.0" width="8.0" height="8.0" rx="2.0" fill="#b5c5de"/></g><text x="161.0" y="706.0" font-family="Manrope" font-size="15.5" font-weight="400" fill="#b5c5de">“Status” and “applet update status” looked alike and got mixed up.</text></g><g id="li.pseudo-off-138"><g opacity="0.700"><rect x="141.0" y="731.8" width="8.0" height="8.0" rx="2.0" fill="#b5c5de"/></g><text x="161.0" y="740.8" font-family="Manrope" font-size="15.5" font-weight="400" fill="#b5c5de">Bulk applet updates had no limit, preview or confirmation.</text></g></g></g></g><g id="article.ps-card-140"><rect x="728.0" y="378.1" width="612.0" height="410.5" rx="24.0" fill="#6cb6ff"/><g clip-path="url(#c147)"><g id="span.label-141"><g id="span.dot-142"><rect x="768.0" y="430.1" width="8.0" height="8.0" rx="4.0" fill="#061633"/></g><text x="786.0" y="437.5" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="1.92" fill="#061633">SOLUTION STATEMENT</text></g><g><text x="768.0" y="493.3" font-family="Unbounded" font-size="34" font-weight="800" letter-spacing="-0.68" fill="#061633">See it, trace it, fix</text><text x="768.0" y="527.9" font-family="Unbounded" font-size="34" font-weight="800" letter-spacing="-0.68" fill="#061633">it — in one place.</text></g><g><text x="768.0" y="568.6" font-family="Manrope" font-size="17" font-weight="400" fill="#061633">A dashboard that answers “is anything wrong?” in five seconds, then</text><text x="768.0" y="595.8" font-family="Manrope" font-size="17" font-weight="400" fill="#061633">lets operators drill from a circle to a BTS to the exact devices, and</text><text x="768.0" y="623.0" font-family="Manrope" font-size="17" font-weight="400" fill="#061633">run capped, confirmed SIM Applet updates on real data.</text></g><g id="ul.ps-list-143"><g id="li.pseudo-off-144"><g opacity="0.700"><rect x="768.0" y="661.2" width="8.0" height="8.0" rx="2.0" fill="#061633"/></g><text x="788.0" y="670.2" font-family="Manrope" font-size="15.5" font-weight="400" fill="#061633">Fleet health on one screen, numbers that animate when data changes.</text></g><g id="li.pseudo-off-145"><g opacity="0.700"><rect x="768.0" y="696.0" width="8.0" height="8.0" rx="2.0" fill="#061633"/></g><text x="788.0" y="705.0" font-family="Manrope" font-size="15.5" font-weight="400" fill="#061633">Circle → BTS → device drill-down with customer impact.</text></g><g id="li.pseudo-off-146"><g opacity="0.700"><rect x="768.0" y="730.8" width="8.0" height="8.0" rx="2.0" fill="#061633"/></g><text x="788.0" y="739.8" font-family="Manrope" font-size="15.5" font-weight="400" fill="#061633">Bulk updates capped at 1,000 devices per session.</text></g></g></g></g></g><g id="div.ba-148"><g><rect x="100.0" y="804.5" width="402.7" height="175.2" rx="18.0" fill="#0b1a36"/><rect x="100.5" y="805.0" width="401.7" height="174.2" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><text x="125.0" y="847.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#93a7c6">FIND THE FAILING BTS</text></g><g><g id="span.from-149"><text x="125.0" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#93a7c6">~2 hrs</text></g><text x="247.2" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#eaf1fc">→ 3 clicks</text></g></g><g><rect x="518.7" y="804.5" width="402.7" height="175.2" rx="18.0" fill="#0b1a36"/><rect x="519.2" y="805.0" width="401.7" height="174.2" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><text x="543.7" y="847.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#93a7c6">WHAT OPERATORS SCAN</text></g><g><g id="span.from-150"><text x="543.7" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#93a7c6">1M rows</text></g><text x="709.0" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#eaf1fc">→ 9</text><text x="543.7" y="943.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#eaf1fc">screens</text></g></g><g><rect x="937.3" y="804.5" width="402.7" height="175.2" rx="18.0" fill="#0b1a36"/><rect x="937.8" y="805.0" width="401.7" height="174.2" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><text x="962.3" y="847.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#93a7c6">BULK UPDATE GUARDRAIL</text></g><g><g id="span.from-151"><text x="962.3" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#93a7c6">none</text></g><text x="1064.0" y="895.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#eaf1fc">→ 1,000 /</text><text x="962.3" y="943.7" font-family="Unbounded" font-size="30" font-weight="700" fill="#eaf1fc">session</text></g></g></g></g></g></svg>