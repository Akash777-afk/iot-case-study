 y="466.0" width="19.0" height="19.0" rx="9.5" fill="none" stroke="#6cb6ff" stroke-width="3"/></g><g id="span.ix-115"><text x="506.7" y="565.5" font-family="Unbounded" font-size="34" font-weight="800" fill="#17356b">02</text></g><g id="span.wk-116"><text x="374.2" y="553.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#93a7c6">WEEK 2</text></g><g><text x="374.2" y="591.7" font-family="Unbounded" font-size="20" font-weight="800" letter-spacing="-0.40" fill="#eaf1fc">Define</text></g><g><text x="374.2" y="622.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">Framed one question:</text><text x="374.2" y="646.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">which fault is hurting which</text><text x="374.2" y="670.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">customer, right now?</text></g><g><g><rect x="374.2" y="691.1" width="70.8" height="27.6" rx="13.8" fill="#17356b"/><text x="383.2" y="708.1" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#93c5fd">Personas</text></g><g><rect x="451.0" y="691.1" width="37.8" height="27.6" rx="13.8" fill="#17356b"/><text x="460.0" y="708.1" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#93c5fd">HMW</text></g></g></g><g id="article.step-117"><rect x="602.4" y="508.5" width="235.2" height="261.2" rx="18.0" fill="#0b1a36"/><rect x="602.9" y="509.0" width="234.2" height="260.2" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><rect x="625.4" y="464.5" width="22.0" height="22.0" rx="11.0" fill="#050c1c"/><rect x="626.9" y="466.0" width="19.0" height="19.0" rx="9.5" fill="none" stroke="#6cb6ff" stroke-width="3"/></g><g id="span.ix-118"><text x="757.9" y="565.5" font-family="Unbounded" font-size="34" font-weight="800" fill="#17356b">03</text></g><g id="span.wk-119"><text x="625.4" y="553.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.