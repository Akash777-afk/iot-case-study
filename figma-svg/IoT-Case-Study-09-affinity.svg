<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1003" viewBox="0 0 1440 1003" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="100%" height="100%" fill="#050c1c"/><g id="section.band-337"><g id="div.rail-338"><g id="div.sec-head-339"><g><g id="span.label-340"><g id="span.dot-341"><rect x="100.0" y="132.0" width="8.0" height="8.0" rx="4.0" fill="#6cb6ff"/></g><text x="118.0" y="139.4" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="1.92" fill="#93a7c6">08 — AFFINITY MAPPING</text></g><g><text x="100.0" y="230.2" font-family="Unbounded" font-size="72" font-weight="800" letter-spacing="-1.44" fill="#eaf1fc">64 notes,</text><g><text x="100.0" y="303.6" font-family="Unbounded" font-size="72" font-weight="800" letter-spacing="-1.44" fill="#6cb6ff">four themes.</text></g></g></g><g><text x="794.5" y="252.5" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">Interview notes clustered into four themes. Each theme</text><text x="794.5" y="279.7" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">became a part of the product. Drag the notes around; it’s a</text><text x="794.5" y="306.9" font-family="Manrope" font-size="17" font-weight="400" fill="#93a7c6">working board.</text></g></g><g id="div.board-342"><rect x="100.0" y="378.1" width="1240.0" height="356.4" rx="26.0" fill="#0b1a36"/><rect x="100.5" y="378.6" width="1239.0" height="355.4" rx="25.5" fill="none" stroke="#2c4c80" stroke-width="1" stroke-dasharray="4 3"/><g id="div.cluster-343"><g><rect x="129.0" y="407.1" width="183.3" height="35.2" rx="17.6" fill="#17356b"/><g><text x="141.0" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="900" letter-spacing="1.20" fill="#6cb6ff">●</text></g><text x="157.4" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="700" letter-spacing="1.20" fill="#eaf1fc">FINDING THE FAULT</text></g><g id="div.stickies-344"><g id="div.sticky-345"><path d="M133 456.25H405.5A4 4 0 0 1 409.5 460.25V517.3125A14 14 0 0 1 395.5 531.3125H133A4 4 0 0 1 129 527.3125V460.25A4 4 0 0 1 133 456.25Z" fill="#fde68a"/><text x="145.0" y="487.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“I filter city by city in Excel.”</text><g opacity="0.650"><text x="145.0" y="509.8" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">OPERATOR · P2</text></g></g><g id="div.sticky-346"><path d="M133 543.3125H405.5A4 4 0 0 1 409.5 547.3125V604.375A14 14 0 0 1 395.5 618.375H133A4 4 0 0 1 129 614.375V547.3125A4 4 0 0 1 133 543.3125Z" fill="#fde68a"/><text x="145.0" y="574.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“400 red rows, one tower.”</text><g opacity="0.650"><text x="145.0" y="596.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">ENGINEER · P5</text></g></g><g id="div.sticky-347"><path d="M133 630.375H405.5A4 4 0 0 1 409.5 634.375V691.4375A14 14 0 0 1 395.5 705.4375H133A4 4 0 0 1 129 701.4375V634.375A4 4 0 0 1 133 630.375Z" fill="#fde68a"/><text x="145.0" y="661.4" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“I need the BTS, not the device.”</text><g opacity="0.650"><text x="145.0" y="683.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">OPERATOR · P1</text></g></g></g></g><g id="div.cluster-348"><g><rect x="429.5" y="407.1" width="174.8" height="35.2" rx="17.6" fill="#17356b"/><g><text x="441.5" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="900" letter-spacing="1.20" fill="#6cb6ff">●</text></g><text x="457.9" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="700" letter-spacing="1.20" fill="#eaf1fc">UPDATING APPLETS</text></g><g id="div.stickies-349"><g id="div.sticky-350"><path d="M433.5 456.25H706A4 4 0 0 1 710 460.25V517.3125A14 14 0 0 1 696 531.3125H433.5A4 4 0 0 1 429.5 527.3125V460.25A4 4 0 0 1 433.5 456.25Z" fill="#bfdbfe"/><text x="445.5" y="487.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Scared of a bad bulk push.”</text><g opacity="0.650"><text x="445.5" y="509.8" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">OPERATOR · P3</text></g></g><g id="div.sticky-351"><path d="M433.5 543.3125H706A4 4 0 0 1 710 547.3125V604.375A14 14 0 0 1 696 618.375H433.5A4 4 0 0 1 429.5 614.375V547.3125A4 4 0 0 1 433.5 543.3125Z" fill="#bfdbfe"/><text x="445.5" y="574.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Which ones are compatible?”</text><g opacity="0.650"><text x="445.5" y="596.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">ENGINEER · P6</text></g></g><g id="div.sticky-352"><path d="M433.5 630.375H706A4 4 0 0 1 710 634.375V691.4375A14 14 0 0 1 696 705.4375H433.5A4 4 0 0 1 429.5 701.4375V634.375A4 4 0 0 1 433.5 630.375Z" fill="#bfdbfe"/><text x="445.5" y="661.4" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Did the update finish?”</text><g opacity="0.650"><text x="445.5" y="683.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">OPERATOR · P4</text></g></g></g></g><g id="div.cluster-353"><g><rect x="730.0" y="407.1" width="149.6" height="35.2" rx="17.6" fill="#17356b"/><g><text x="742.0" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="900" letter-spacing="1.20" fill="#6cb6ff">●</text></g><text x="758.4" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="700" letter-spacing="1.20" fill="#eaf1fc">TRUST IN DATA</text></g><g id="div.stickies-354"><g id="div.sticky-355"><path d="M734 456.25H1006.5A4 4 0 0 1 1010.5 460.25V517.3125A14 14 0 0 1 996.5 531.3125H734A4 4 0 0 1 730 527.3125V460.25A4 4 0 0 1 734 456.25Z" fill="#a7f3d0"/><text x="746.0" y="487.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Status or applet status?”</text><g opacity="0.650"><text x="746.0" y="509.8" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">OPERATOR · P2</text></g></g><g id="div.sticky-356"><path d="M734 543.3125H1006.5A4 4 0 0 1 1010.5 547.3125V604.375A14 14 0 0 1 996.5 618.375H734A4 4 0 0 1 730 614.375V547.3125A4 4 0 0 1 734 543.3125Z" fill="#a7f3d0"/><text x="746.0" y="574.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Is this number live?”</text><g opacity="0.650"><text x="746.0" y="596.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">MANAGER · P7</text></g></g><g id="div.sticky-357"><path d="M734 630.375H1006.5A4 4 0 0 1 1010.5 634.375V691.4375A14 14 0 0 1 996.5 705.4375H734A4 4 0 0 1 730 701.4375V634.375A4 4 0 0 1 734 630.375Z" fill="#a7f3d0"/><text x="746.0" y="661.4" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Export must match the screen.”</text><g opacity="0.650"><text x="746.0" y="683.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">ENGINEER · P5</text></g></g></g></g><g id="div.cluster-358"><g><rect x="1030.5" y="407.1" width="166.5" height="35.2" rx="17.6" fill="#17356b"/><g><text x="1042.5" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="900" letter-spacing="1.20" fill="#6cb6ff">●</text></g><text x="1058.9" y="428.1" font-family="JetBrains Mono" font-size="12" font-weight="700" letter-spacing="1.20" fill="#eaf1fc">CUSTOMER IMPACT</text></g><g id="div.stickies-359"><g id="div.sticky-360"><path d="M1034.5 456.25H1307A4 4 0 0 1 1311 460.25V517.3125A14 14 0 0 1 1297 531.3125H1034.5A4 4 0 0 1 1030.5 527.3125V460.25A4 4 0 0 1 1034.5 456.25Z" fill="#fbcfe8"/><text x="1046.5" y="487.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Which customer is hit most?”</text><g opacity="0.650"><text x="1046.5" y="509.8" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">MANAGER · P8</text></g></g><g id="div.sticky-361"><path d="M1034.5 543.3125H1307A4 4 0 0 1 1311 547.3125V604.375A14 14 0 0 1 1297 618.375H1034.5A4 4 0 0 1 1030.5 614.375V547.3125A4 4 0 0 1 1034.5 543.3125Z" fill="#fbcfe8"/><text x="1046.5" y="574.3" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Show trend, not a snapshot.”</text><g opacity="0.650"><text x="1046.5" y="596.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">MANAGER · P7</text></g></g><g id="div.sticky-362"><path d="M1034.5 630.375H1307A4 4 0 0 1 1311 634.375V691.4375A14 14 0 0 1 1297 705.4375H1034.5A4 4 0 0 1 1030.5 701.4375V634.375A4 4 0 0 1 1034.5 630.375Z" fill="#fbcfe8"/><text x="1046.5" y="661.4" font-family="Manrope" font-size="14.5" font-weight="600" fill="#10203d">“Is SMS fallback rising?”</text><g opacity="0.650"><text x="1046.5" y="683.9" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="0.80" fill="#10203d">ENGINEER · P6</text></g></g></g></g></g><g id="div.hmw-363"><g><rect x="100.0" y="750.4" width="298.0" height="132.4" rx="18.0" fill="#102a54"/><rect x="100.5" y="750.9" width="297.0" height="131.4" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><text x="123.0" y="793.4" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#6cb6ff">HOW MIGHT WE</text></g><g><text x="123.0" y="826.6" font-family="Manrope" font-size="16" font-weight="600" fill="#eaf1fc">show the one failing BTS behind</text><text x="123.0" y="852.2" font-family="Manrope" font-size="16" font-weight="600" fill="#eaf1fc">hundreds of red devices?</text></g></g><g><rect x="414.0" y="750.4" width="298.0" height="132.4" rx="18.0" fill="#102a54"/><r