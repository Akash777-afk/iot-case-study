f1fc">Prototype</text></g><g><text x="876.6" y="622.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">Low-fi grids, then high-fidelity</text><text x="927.0" y="646.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">screens on one</text><text x="876.6" y="670.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">token system in Figma.</text></g><g><g><rect x="876.6" y="691.1" width="84.0" height="27.6" rx="13.8" fill="#17356b"/><text x="885.6" y="708.1" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#93c5fd">Wireframes</text></g><g><rect x="966.6" y="691.1" width="57.6" height="27.6" rx="13.8" fill="#17356b"/><text x="975.6" y="708.1" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#93c5fd">Tokens</text></g></g></g><g id="article.step-123"><rect x="1104.8" y="508.5" width="235.2" height="261.2" rx="18.0" fill="#0b1a36"/><rect x="1105.3" y="509.0" width="234.2" height="260.2" rx="17.5" fill="none" stroke="#1e3a66" stroke-width="1"/><g><rect x="1127.8" y="464.5" width="22.0" height="22.0" rx="11.0" fill="#050c1c"/><rect x="1129.3" y="466.0" width="19.0" height="19.0" rx="9.5" fill="none" stroke="#6cb6ff" stroke-width="3"/></g><g id="span.ix-124"><text x="1261.4" y="565.5" font-family="Unbounded" font-size="34" font-weight="800" fill="#17356b">05</text></g><g id="span.wk-125"><text x="1127.8" y="553.5" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="1.54" fill="#93a7c6">WEEK 4–5</text></g><g><text x="1127.8" y="591.7" font-family="Unbounded" font-size="20" font-weight="800" letter-spacing="-0.40" fill="#eaf1fc">Build &amp; test</text></g><g><text x="1127.8" y="622.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">Coded in React +</text><text x="1127.8" y="646.1" font-family="Manrope" font-size="15" font-weight="400" fill="#b5c5de">TypeScript, tested with</text><text x="1127.8" y="670.1" font-family="Manrope" font-s